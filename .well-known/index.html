<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uygulamada Açılıyor...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #6200ee;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Listeye yönlendiriliyorsunuz...</h2>
    <p>Uygulama otomatik açılmazsa aşağıdaki butona tıklayın:</p>
    
    <a id="openAppBtn" href="#" class="btn">Uygulamada Aç</a>

    <script>
        var searchParams = window.location.search;
        var appUrl = "simpletodo://share" + searchParams;

        document.getElementById("openAppBtn").href = appUrl;
        window.location.href = appUrl;
    </script>
</body>
</html>
